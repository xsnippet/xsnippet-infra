[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
Output=xsnippet
OutputDirectory=output

[Content]
Bootable=yes
BuildPackages =
        gh
        ca-certificates
Packages =
        # Required for systemd-nspawn --boot
        login
        nftables
        systemd
        # Required for systemd-vmspawn
        systemd-boot-efi
        # Required for database setup
        python3
        python3-alembic
        python3-psycopg2
        # Required for serving
        caddy
        goaccess
        postgresql
        postgresql-contrib

[Build]
WithNetwork=yes
Environment =
        GH_TOKEN
