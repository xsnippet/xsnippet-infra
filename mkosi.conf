[Config]
MinimumVersion=25.3

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
Output=xsnippet
OutputDirectory=mkosi.output

[Content]
Bootable=yes
Bootloader=systemd-boot
Packages=systemd,systemd-sysv,systemd-boot,systemd-resolved,systemd-timesyncd
         udev,dbus,ca-certificates,tzdata,locales
         postgresql,postgresql-contrib,libpq5,python3,python3-alembic,python3-psycopg2
         caddy,goaccess,nftables,curl,gzip,tar
Timezone=UTC
Locale=C.UTF-8
Hostname=xsnippet

[Build]
WithNetwork=yes
Environment=API_RELEASE=nightly WEB_RELEASE=nightly
            API_HOST=api.xsnippet.org RAW_HOST=raw.xsnippet.org
            WEB_HOST=xsnippet.org GOACCESS_HOST=rt.xsnippet.org
            CADDY_EMAIL=dev@xsnippet.org
            GOACCESS_USER=xsnippet
            GOACCESS_PASSWORD_HASH

[Runtime]
RuntimeNetwork=interface
